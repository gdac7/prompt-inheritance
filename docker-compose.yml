services:
  pi:
    build: .
    image: prompt-inheritance:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # rede do host: o juiz remoto (SCORER_ADDRESS) precisa estar acessível como no host
    network_mode: host
    ipc: host
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - .:/workspace/prompt-inheritance
      - ${HF_CACHE:-~/.cache/huggingface}:/hf-cache
    working_dir: /workspace/prompt-inheritance/test
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Protocolo completo do GAPI (test/run_gapi_experiments.sh); PI_RESULTS e PI_CLASSIFICATIONS
  # apontam, a partir de test/, para os resultados antigos do PI usados na comparação
  gapi:
    extends: pi
    command: bash run_gapi_experiments.sh
    environment:
      - PI_RESULTS=${PI_RESULTS:-}
      - PI_CLASSIFICATIONS=${PI_CLASSIFICATIONS:-}
      - SEEDS=${SEEDS:-0 1 2}
      - N_REQUESTS=${N_REQUESTS:-100}
